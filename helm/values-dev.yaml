replicaCount: 1

image:
  repository: ghcr.io/benflux-company/paradise-assistance
  tag: bb6274801b501466b4a9aabff1bf4453ecb9f6c3
  pullPolicy: Always

service:
  port: 80
  targetPort: 3000

ingress:
  host: paradise-dev.benfluxgroup.com

healthCheck:
  liveness: /api/health
  readiness: /api/health?ready=1

env:
  NODE_ENV: production
  APP_ENV: dev
  PORT: "3000"
  PUBLIC_SITE_URL: https://paradise-dev.benfluxgroup.com

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgres:
  image: postgres:15-alpine
  storage: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  backup:
    enabled: false
    schedule: "0 3 * * *"
    storage: 2Gi
    retentionDays: 7

resourceQuota:
  requestsCpu: "1"
  requestsMemory: 768Mi
  limitsCpu: "2"
  limitsMemory: 1536Mi

limitRange:
  defaultRequestCpu: 50m
  defaultRequestMemory: 128Mi
  defaultLimitCpu: 300m
  defaultLimitMemory: 384Mi
