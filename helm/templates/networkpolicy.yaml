apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP traffic from the nginx ingress controller only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: {{ .Values.service.targetPort }}
  egress:
    # In-namespace Postgres.
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Chart.Name }}-postgres
      ports:
        - port: 5432
          protocol: TCP
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Outbound HTTPS (Cloudinary) + SMTP submission (nodemailer).
    - ports:
        - port: 443
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
